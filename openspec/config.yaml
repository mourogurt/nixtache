schema: spec-driven

# Project context (shown to AI when creating artifacts).
context: |
  Working language: English. All documentation (README, doc/**), specs and
  change artifacts are written in English. Frozen historical material under
  doc/archive/ and the not-yet-translated specs (direct-deploy, deploy-user)
  are the only exceptions. The canonical requirement corpus is
  openspec/specs/ (capabilities); doc/archive/ holds frozen legacy specs.

# Per-artifact rules (applied when writing that artifact).
rules:
  proposal:
    - Write in English.
  specs:
    - Write in English.
  design:
    - Write in English.
  tasks:
    - Write in English.
    - Every change touching functional surfaces (modules, workflows, actions, options) must include a task to update README.md and the affected doc/user_guide/ + doc/technical_details/ documents, with links to the relevant openspec specs (openspec/specs/).
