schema: spec-driven

# Project context (shown to AI when creating artifacts).
context: |
  Working language: English. All documentation (README, doc/**), specs and
  change artifacts are written in English. Frozen historical material under
  doc/archive/ is the only exception. The canonical requirement corpus is
  openspec/specs/ (capabilities); doc/archive/ holds frozen legacy specs.
  Maintained docs, option descriptions and canonical specs describe current
  behavior, invariants and operational risks, not implementation chronology,
  resolved-bug stories or work-in-progress status. Chronology belongs in commit
  messages, change artifacts and doc/archive/. Keep failure scenarios only for
  current risks, constraints or recovery; migration/version notes are allowed
  when actionable.
  Maintained docs (README, doc/**) link to canonical openspec/specs/ artifacts,
  not active openspec/changes/<name>/ directories. Sync and archive revalidate
  maintained-doc links after merging specs or moving change artifacts; replace
  active-change links with canonical spec links or final archived paths.

operations:
  archive:
    guidance:
      - Before archiving and again after moving the change, scan README.md and doc/**/*.md for links into openspec/changes/. Replace active-change links with canonical openspec/specs/ links or final archived paths, then verify that no broken maintained-doc links remain.

# Per-artifact rules (applied when writing that artifact).
rules:
  proposal:
    - Write in English.
  specs:
    - Write in English.
    - Specify current contracts and invariants, not implementation chronology or resolved-bug history.
  design:
    - Write in English.
  tasks:
    - Write in English.
    - Every change touching functional surfaces (modules, workflows, actions, options) must include a task to update README.md when the map/overview changes and the affected doc/user_guide/ + doc/technical_details/ documents, with links to the relevant openspec specs (openspec/specs/).
