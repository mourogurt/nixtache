name: "Nix Flake Validation"
description: "Validate a nix flake with `nix flake check`"

runs:
  using: "composite"
  steps:
    - name: Validate nix configuration
      shell: bash
      run: |
        set -euo pipefail
        # SANDBOX_OK is exported by the sandbox-probe action (1 = the probe
        # build succeeded under the daemon sandbox; 0/unset = broken or
        # unsupported). Only fall back to --no-sandbox in the 0 case so the
        # check still runs instead of dying on missing namespaces.
        if [ "${SANDBOX_OK:-0}" = "1" ]; then
          SANDBOX_FLAG=""
        else
          echo "SANDBOX_OK!=1 → --no-sandbox (legacy/unprivileged runner)"
          SANDBOX_FLAG="--no-sandbox"
        fi
        # tee into artifacts/ so a failed validation leaves a downloadable log
        # in the always-run upload; pipefail (set above) keeps the non-zero
        # exit from nix flake check despite the pipe.
        mkdir -p artifacts
        if ! nix flake check --show-trace --all-systems $SANDBOX_FLAG 2>&1 | tee artifacts/flake-check.log; then
          echo "Nix configuration validation failed!"
          exit 1
        fi
