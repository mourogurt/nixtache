name: "NixOS Rebuild All Configurations"
description: "Rebuild all NixOS configurations found in the current flake"

runs:
  using: "composite"
  steps:
    - name: Rebuild all nixosConfigurations
      shell: bash
      run: |
        set -uo pipefail
        configs=$(nix flake show --json | jq -r '.nixosConfigurations | keys[]')

        if [ -z "$configs" ]; then
          echo "No NixOS configurations found in flake"
          exit 1
        fi

        for config in $configs; do
          echo "Building NixOS configuration: $config"
          mkdir -p artifacts
          set +e
          nix build --no-sandbox --print-out-paths .#nixosConfigurations.$config.config.system.build.toplevel --no-link --print-build-logs &> "artifacts/rebuild_$config.log"
          build_exit=$?
          set -e
          echo "--- Last 50 lines of $config build log ---"
          tail -n 50 "artifacts/rebuild_$config.log"
          if [ $build_exit -ne 0 ]; then
            echo "BUILD FAILED for $config (exit code: $build_exit)"
            exit 1
          fi
        done
