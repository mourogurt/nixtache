name: "Sandbox probe"
description: |
  Detect at RUNTIME whether the Nix build sandbox works on this runner, and
  export SANDBOX_OK (1 = sandbox usable, 0 = fall back to --no-sandbox) to
  GITHUB_ENV. Replaces the static HAS_SANDBOX_CAP flag: no manual rebuild of the
  server is needed before CI works, and a runner whose sandbox is broken (or not
  yet rebuilt with the /proc fix) self-heals to --no-sandbox instead of failing.
  Subsequent build actions (rebuild-configurations, rebuild-devshells,
  deploy-target) read SANDBOX_OK and append --no-sandbox when it is 0/unset.

runs:
  using: "composite"
  steps:
    - name: Probe nix sandbox
      shell: bash
      run: |
        set -uo pipefail
        # A fresh runCommand (unique name → not in any cache → always built
        # locally) triggers the daemon's sandbox. Uses the CALLER's own pinned
        # nixpkgs (builtins.getFlake of the checked-out flake) so no extra fetch
        # and no registry dependency. If the daemon sandbox is off, this builds
        # without sandboxing (harmless, succeeds). If the sandbox is on but
        # broken (nspawn /proc-lock without the PrivateMounts+remount fix), the
        # build fails → SANDBOX_OK=0 → build steps use --no-sandbox.
        probe_log=$(mktemp)
        if nix build --no-link --impure --expr \
          'let self = builtins.getFlake (toString ./.); in self.inputs.nixpkgs.legacyPackages.${builtins.currentSystem}.runCommand "nixtache-sandbox-probe" {} "true"' \
          > "$probe_log" 2>&1; then
          echo "sandbox-probe: sandboxed build OK → sandbox ON for this job."
          echo "SANDBOX_OK=1" >> "$GITHUB_ENV"
        else
          echo "::warning::nix sandbox unavailable on this runner; builds will use --no-sandbox."
          echo "  probe output (last 3 lines):"
          tail -3 "$probe_log" | sed 's/^/    /'
          echo "SANDBOX_OK=0" >> "$GITHUB_ENV"
        fi
        rm -f "$probe_log"
