name: "Sandbox probe"
description: |
  Probe whether a Nix build succeeds without an explicit --no-sandbox and
  export SANDBOX_OK (1 = probe succeeded, 0 = fall back to --no-sandbox) to
  GITHUB_ENV. Subsequent build actions read SANDBOX_OK and append --no-sandbox
  when it is 0/unset.

runs:
  using: "composite"
  steps:
    - name: Probe nix sandbox
      shell: bash
      run: |
        set -uo pipefail
        # runCommand uses the CALLER's pinned nixpkgs (builtins.getFlake of the
        # checked-out flake), so no registry dependency is needed. A successful
        # realization leaves builds unchanged; a failure makes later build steps
        # use --no-sandbox. Sandboxing can be disabled and still produce success.
        # The build command MUST create $out — a bare "true" fails with
        # "builder failed to produce output path" on every runner, sandboxed
        # or not, making the probe report a false negative.
        probe_log=$(mktemp)
        if nix build --no-link --impure --expr \
          'let self = builtins.getFlake (toString ./.); in self.inputs.nixpkgs.legacyPackages.${builtins.currentSystem}.runCommand "nixtache-sandbox-probe" {} "mkdir -p $out"' \
          > "$probe_log" 2>&1; then
          echo "sandbox-probe: build OK; later steps will not add --no-sandbox."
          echo "SANDBOX_OK=1" >> "$GITHUB_ENV"
        else
          echo "::warning::sandbox probe build failed; builds will use --no-sandbox."
          echo "  probe output (last 3 lines):"
          tail -3 "$probe_log" | sed 's/^/    /'
          echo "SANDBOX_OK=0" >> "$GITHUB_ENV"
        fi
        rm -f "$probe_log"
