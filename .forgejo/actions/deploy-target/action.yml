name: "Deploy to targets"
description: |
  V2 direct-deploy: for each `nixosConfigurations.<name>` in the flake that has an
  entry in the deploy map (`$NIXTACHE_DEPLOY_TARGETS`, exported by the nixtache
  runner module), discover → SSH-probe → activate. Activation is systemd-native:
  `method=live` builds the toplevel, `nix copy --to` pushes the closure, drops a
  pointer file and triggers the target's root-owned `nixtache-apply.service`
  (probe + rollback live inside that unit). No deploy-rs, no sudo/doas/run0.
  `method=ab-image` (Batch E) builds the `sysupdate-package`, stages it into the
  central A/B store, GPG-signs the manifest, and signals the target's
  `systemd-sysupdate` (idle-gated on the runner host; immediate on remote
  targets).   Offline / unmapped / keyless targets are skipped with a warning
  (R1/R5) — they never fail the whole job. Each `live` target's free store
  space is checked twice against its `minFreeBytes` preset: pre-build (fast
  refuse below the preset) and post-build (missing-closure-paths estimate ×
  1.1 + preset; full closure as fallback). A target that cannot hold the
  deployment records a per-target error, the loop continues with the
  remaining targets, and the job fails at the end if any target errored. A
  target whose SSH gate predates the free-space query (protocol drift) is
  skipped with a warning and never fails the job.

runs:
  using: "composite"
  steps:
    - name: Discover → probe → activate
      shell: bash
      env:
        # Make the map + sandbox-probe result explicit (the runner module exports
        # the map; sandbox-probe sets SANDBOX_OK). Pin so the step fails loudly if
        # they're absent on a non-nixtache runner.
        NIXTACHE_DEPLOY_TARGETS: ${{ env.NIXTACHE_DEPLOY_TARGETS }}
        SANDBOX_OK: ${{ env.SANDBOX_OK }}
        # ab-image support (Batch E): only exported when the runner host has
        # services.nixtache.runner.deploy.ab.enable = true. Empty when disabled —
        # _abImage fails clearly in that case.
        NIXTACHE_AB_STAGE: ${{ env.NIXTACHE_AB_STAGE }}
        NIXTACHE_RUNNER_HOST: ${{ env.NIXTACHE_RUNNER_HOST }}
      run: |
        set -uo pipefail
        mkdir -p artifacts

        # --- mode from branch (§7.1): PR → dry-activate; main → switch ---------
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          mode=dry-activate
        elif [ "$(basename "$GITHUB_REF")" = "main" ]; then
          mode=switch
        else
          mode=dry-activate
        fi
        echo "deploy-target: mode=$mode (event=$GITHUB_EVENT_NAME ref=$GITHUB_REF)"

        if [ -z "${NIXTACHE_DEPLOY_TARGETS:-}" ]; then
          echo "::warning::NIXTACHE_DEPLOY_TARGETS is empty — no deploy targets configured (services.nixtache.runner.deploy.targets). Nothing to deploy."
          exit 0
        fi

        # SANDBOX_OK: 1 = sandbox works (from sandbox-probe action); 0/unset = --no-sandbox.
        if [ "${SANDBOX_OK:-0}" = "1" ]; then SANDBOX_FLAG=""; else SANDBOX_FLAG="--no-sandbox"; fi

        cred_dir="${CREDENTIALS_DIRECTORY:-}"
        configs=$(nix flake show --json | jq -r '.nixosConfigurations | keys[]')
        if [ -z "$configs" ]; then
          echo "::warning::no nixosConfigurations in this flake — nothing to deploy."
          exit 0
        fi

        # --- per-target activate -------------------------------------------------
        # _liveApply cfg t mode key: pre-copy disk check → build toplevel →
        # sized disk check → copy → trigger apply-unit. Exit codes: 1 = the
        # target FAILED (job goes red at the end); 2 = protocol drift (the
        # target's gate predates the free-space query) — the loop skips such
        # targets with a warning; drift alone never fails the job.
        _liveApply() {
          local cfg="$1" t="$2" mode="$3" key="$4"
          local user host port extra
          user=$(jq -r .sshUser <<<"$t"); host=$(jq -r .host <<<"$t"); port=$(jq -r .sshPort <<<"$t")
          extra=$(jq -r '.extraOptions[]?' <<<"$t")
          # Free-space preset for this target (absent on older runner modules →
          # 5 GiB default). 0 = pre-copy check disabled for this target.
          local preset
          preset=$(jq -r '.minFreeBytes // 5368709120' <<<"$t")

          # NIX_SSHOPTS so `nix copy --to ssh://` uses the deploy key + port.
          # UserKnownHostsFile is pinned into the job workspace: the runner job
          # env has no HOME, so default known-hosts handling warns (`/.ssh`) on
          # every connection and persists nothing; a workspace file gives
          # host-key verification a stable per-job location (TOFU once per job
          # per host via accept-new).
          local ssh_opts="-i $key -p $port -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$PWD/.deploy-known-hosts"
          export NIX_SSHOPTS="$ssh_opts"

          # Stage 1 (pre-build fast refuse): one df round-trip, reused by
          # stage 2. The df query is whitelisted verbatim by the target's SSH
          # gate; a rejected or unparseable answer means protocol drift (a
          # pre-change gate on the target) — a transition condition, NOT a
          # target failure: return 2 so the loop skips with a warning.
          local avail=""
          if [ "$preset" -gt 0 ]; then
            avail=$(ssh $ssh_opts "$user@$host" "df -B1 --output=avail /nix/store" 2>/dev/null | tail -n1 | tr -d ' ')
            case "$avail" in
              ""|*[!0-9]*)
                echo "::warning::$cfg: target $host rejected the free-space query — its gate predates this action (protocol drift). Skipped. Transition hatch: set services.nixtache.deploy-target.deployUser.sshGate = \"restrict\" on the target until both sides carry the new protocol (see doc/user_guide/migration.md)."
                return 2 ;;
            esac
            if [ "$avail" -lt "$preset" ]; then
              echo "::error::$cfg: target $host low on disk ($avail B free, preset $preset B minimum)"
              return 1
            fi
          fi

          echo "→ $cfg: live (mode=$mode) — building toplevel…"
          # stdout (--print-out-paths) = the store path; stderr (build log) → artifact.
          local P
          P=$(nix build --no-link --print-out-paths $SANDBOX_FLAG .#nixosConfigurations.$cfg.config.system.build.toplevel 2>&1)
          # keep only the last /nix/store/... line (nix prints the path to stdout,
          # warnings/errors to stderr — merged above; the store path is the signal).
          P=$(grep -E '^/nix/store/' <<<"$P" | tail -n1)
          if [ -z "$P" ]; then
            echo "::error::$cfg: toplevel build failed (no store path in output)"; return 1
          fi

          # Stage 2 (post-build sized check): need = Σ narSize of closure paths
          # MISSING on the target (remote store inventory through the serve
          # channel) × 1.1 + preset headroom. Text output (`-r -S` / `--all`)
          # rather than `--json` (deprecated without --json-format; shape
          # differs across nix versions). When either side of the inventory
          # fails, fall back to the conservative full closure size × 1.1 +
          # preset (a conservative refusal is safe; a delta-unaware one would
          # falsely block routine deploys).
          if [ "$preset" -gt 0 ]; then
            local need sum inv local_closure
            inv=$(mktemp); local_closure=$(mktemp)
            need=""
            if nix path-info -r -S "$P" > "$local_closure" 2>/dev/null \
               && nix path-info --store "ssh://$user@$host" --all > "$inv" 2>/dev/null; then
              sum=$(awk 'NR==FNR { present[$1]=1; next } !($1 in present) { s += $NF } END { print s+0 }' \
                "$inv" "$local_closure")
              case "$sum" in
                ""|*[!0-9]*) sum="" ;;
              esac
              [ -n "$sum" ] && need=$(( sum * 11 / 10 + preset ))
            fi
            if [ -z "$need" ]; then
              need=$(nix path-info -s "$P" 2>/dev/null | awk '{print $NF}')
              case "$need" in
                ""|*[!0-9]*)
                  echo "::error::$cfg: cannot estimate the closure size of $P"
                  rm -f "$inv" "$local_closure"; return 1 ;;
              esac
              need=$(( need * 11 / 10 + preset ))
              echo "→ $cfg: remote store inventory unavailable — conservative full-closure estimate"
            fi
            rm -f "$inv" "$local_closure"
            if [ "$avail" -lt "$need" ]; then
              echo "::error::$cfg: target $host low on disk ($avail B free, $need B needed)"
              return 1
            fi
            echo "→ $cfg: disk check ok ($avail B free, $need B needed)"
          fi

          if [ "$mode" = "dry-activate" ]; then
            echo "→ $cfg: dry-activate via nixtache-apply-dry.service (diff, no mutation)"
            # Same V2 transport as switch (no rebuild tool, no remote sudo):
            # (sudo does not exist for the deploy user): push the closure, drop
            # the dry pointer, trigger the root dry-apply unit (polkit start).
            nix copy --to "ssh://$user@$host" "$P" $extra || { echo "::error::$cfg: nix copy failed (dry)"; return 1; }
            ssh $ssh_opts "$user@$host" "echo '$P' > /var/lib/nixtache/pending-dry && systemctl start nixtache-apply-dry.service" \
              || { echo "::error::$cfg: nixtache-apply-dry.service failed — see target journal: journalctl -u nixtache-apply-dry.service"; return 1; }
            echo "✓ $cfg: dry-activate complete (diff in target journal — nothing mutated)"
            return 0
          fi

          # switch: copy closure, drop pointer, trigger root apply-unit (polkit).
          echo "→ $cfg: nix copy closure → $user@$host"
          nix copy --to "ssh://$user@$host" "$P" $extra || { echo "::error::$cfg: nix copy failed"; return 1; }

          echo "→ $cfg: trigger nixtache-apply.service (pointer + systemctl start)"
          # `systemctl start` for Type=oneshot is synchronous: blocks until the
          # unit finishes, exit code = unit result (probe+rollback inside).
          ssh $ssh_opts "$user@$host" "echo '$P' > /var/lib/nixtache/pending-system && systemctl start nixtache-apply.service" \
            || { echo "::error::$cfg: nixtache-apply.service failed (probe/rollback) — see target journal: journalctl -u nixtache-apply.service"; return 1; }
          echo "✓ $cfg: activated $P"
        }

        # _abImage cfg t mode key — A/B image via systemd-sysupdate (Batch E).
        # This is the SINGLE source of the ab-image deploy: the VM test
        # (tests/ab-vm.nix) PARSES this very action.yml, extracts this `run`,
        # sets the module-provided env (NIXTACHE_AB_STAGE, NIXTACHE_RUNNER_HOST,
        # CREDENTIALS_DIRECTORY/sysupdate_signing_key, SANDBOX_FLAG) and runs it
        # host→target — so CI and test can never drift. Do NOT move this logic
        # out to a script (that would break the dynamic parsing).
        _abImage() {
          local cfg="$1" t="$2" mode="$3" key="$4"
          local user host port
          user=$(jq -r .sshUser <<<"$t"); host=$(jq -r .host <<<"$t"); port=$(jq -r .sshPort <<<"$t")
          local stage_root="${NIXTACHE_AB_STAGE:?NIXTACHE_AB_STAGE unset (runner host has services.nixtache.runner.deploy.ab.enable=false)}"
          local stage="$stage_root/$cfg"
          mkdir -p "$stage"

          echo "→ $cfg: ab-image (mode=$mode) — assigning runtime version…"
          # Runtime versioning: the version is assigned HERE, at CI build time
          # (after the config evaluated, before the image builds) — NOT
          # hardcoded in the consumer config. Default: UTC calver
          # YYYYMMDDHHMMSS (monotonic under strverscmp → sysupdate's "newest"
          # resolution works; stateless — no counter to persist).
          # NIXTACHE_AB_VERSION overrides it (tests, manual replays).
          # The value enters the build via the repo's `image-version` file
          # (consumers point services.nixtache.ab-image.imageVersionFile at
          # it); `git add -f` because flakes read the git index. Everything
          # downstream (os-release, UKI name, staged filenames, GPT label)
          # then carries the SAME runtime version.
          local version="${NIXTACHE_AB_VERSION:-$(date -u +%Y%m%d%H%M%S)}"
          echo "→ $cfg: assigning runtime version $version (image-version file)"
          echo "$version" > image-version
          git add -f image-version 2>/dev/null || true

          echo "→ $cfg: ab-image (mode=$mode) — building sysupdate-package…"
          local img
          img=$(nix build --no-link --print-out-paths ${SANDBOX_FLAG:-} .#nixosConfigurations.$cfg.config.system.build.sysupdate-package 2>&1)
          img=$(grep -E '^/nix/store/' <<<"$img" | tail -n1)
          if [ -z "$img" ] || [ ! -d "$img" ]; then
            echo "::error::$cfg: sysupdate-package build failed (no store path, or the config has no system.build.sysupdate-package — wire the consumer A/B prep, see doc/archive/specs/direct-deploy/06-ab-image.md)"; return 1
          fi

          echo "→ $cfg: staging image files into $stage (version $version)"
          cp "$img"/* "$stage"/ || { echo "::error::$cfg: stage copy failed"; return 1; }
          # The manifest covers everything sysupdate may pull: the store image,
          # the UKI and — when the consumer's ab-image ships it (nixtache's
          # module always does) — the slot's lower store DB dump. nullglob
          # keeps hand-rolled consumer preps (no .lower-db artifact) working.
          ( cd "$stage" && shopt -s nullglob && sha256sum *.raw *.efi *.lower-db > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS ) \
            || { echo "::error::$cfg: SHA256SUMS regeneration failed"; return 1; }

          # Sign the manifest if a signing key is provisioned. systemd-sysupdate
          # verifies ONLY OpenPGP/GPG; the key is age-encrypted at rest (sops),
          # exposed here via LoadCredential `sysupdate_signing_key`.
          local sign_key="${CREDENTIALS_DIRECTORY:-/nonexistent}/sysupdate_signing_key"
          if [ -f "$sign_key" ]; then
            echo "→ $cfg: signing SHA256SUMS (OpenPGP/GPG)"
            local GNUPGHOME; GNUPGHOME=$(mktemp -d); export GNUPGHOME
            gpg --batch --import "$sign_key" 2>/dev/null
            ( cd "$stage" && gpg --batch --yes --detach-sign -o SHA256SUMS.gpg SHA256SUMS ) \
              || { rm -rf "$GNUPGHOME"; echo "::error::$cfg: GPG signing failed"; return 1; }
            rm -rf "$GNUPGHOME"
          else
            echo "::warning::$cfg: no sysupdate_signing_key — SHA256SUMS left unsigned (targets MUST set Transfer.Verify=no)"
          fi

          if [ "$mode" = "dry-activate" ]; then
            echo "✓ $cfg: staged (dry-activate, no apply)"; return 0
          fi

          local ssh_opts="-i $key -p $port -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$PWD/.deploy-known-hosts"
          if [ "$host" = "${NIXTACHE_RUNNER_HOST:-}" ]; then
            echo "→ $cfg: local-self ab-image — signal nixtache-ab-apply (idle-gated sysupdate on runner host)"
            ssh $ssh_opts "$user@$host" \
              "mkdir -p /var/lib/nixtache && touch /var/lib/nixtache/ab-pending && systemctl start nixtache-ab-apply.service" \
              || { echo "::error::$cfg: nixtache-ab-apply trigger failed"; return 1; }
          else
            echo "→ $cfg: remote ab-image — trigger target systemd-sysupdate"
            # Stock units split the duties: systemd-sysupdate.service runs
            # `update` (fetch + install, never reboots; Type=simple, so
            # --wait blocks until the update really finished), while
            # systemd-sysupdate-reboot.service runs `reboot` (a purely
            # offline check that reboots only when a NEWER version is
            # already installed). Update alone never reboots; reboot alone
            # never fetches — the trigger must chain both.
            ssh $ssh_opts "$user@$host" \
              "systemctl start --wait systemd-sysupdate.service && systemctl start systemd-sysupdate-reboot.service" \
              || echo "::warning::$cfg: remote sysupdate trigger failed — or the target rebooted into the new slot and dropped the connection; verify on the target"
          fi
          echo "✓ $cfg: ab-image staged + apply signalled"
        }

        # Exported so the per-target `timeout … bash -c` subshells below see
        # the functions and the sandbox flag.
        export SANDBOX_FLAG
        export -f _liveApply _abImage

        # Per-target failures (timeout, low disk, copy/apply errors) are
        # recorded and the loop CONTINUES — one bad target must not starve
        # the rest; the job goes red at the end if any target errored.
        failed_targets=""
        for cfg in $configs; do
          echo ""
          echo "=== target: $cfg ==="
          t=$(echo "$NIXTACHE_DEPLOY_TARGETS" | jq -e --arg n "$cfg" '.[$n]') || { echo "skip: no map entry for $cfg"; continue; }
          # Safe-default: `enable` absent from the JSON (older runner module)
          # means enabled — only an explicit false skips the target.
          t=$(jq 'if .enable == null then . + {enable: true} else . end' <<<"$t")
          [ "$(jq -r .hasKey <<<"$t")" = "true" ] || { echo "skip: $cfg has no deploy key (sshPrivateKey=null)"; continue; }
          [ "$(jq -r .enable <<<"$t")"  = "true" ] || { echo "skip: $cfg enable=false"; continue; }

          key="$cred_dir/deploy_ssh_${cfg}"
          if [ -z "$cred_dir" ] || [ ! -f "$key" ]; then
            echo "::error::$cfg: deploy key $key not found in \$CREDENTIALS_DIRECTORY (LoadCredential deploy_ssh_${cfg} absent)."; exit 1
          fi

          # probe (R5): short SSH ping with the same key; skip+warn if down.
          user=$(jq -r .sshUser <<<"$t"); host=$(jq -r .host <<<"$t"); port=$(jq -r .sshPort <<<"$t")
          if ! ssh -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                  -o UserKnownHostsFile="$PWD/.deploy-known-hosts" \
                  -i "$key" -p "$port" "$user@$host" true 2>>"artifacts/deploy_${cfg}.log"; then
            echo "::warning::$cfg: host $host unreachable (probe failed) — skipping, not failing CI."; continue
          fi

          method=$(jq -r .method <<<"$t")
          # Per-target timeout (minutes) from the map: wrap the whole
          # build+activate of THIS target in timeout(1); 124 = timed out.
          tmo=$(jq -r '.timeout // 240' <<<"$t")
          case "$method" in
            live)     timeout "${tmo}m" bash -c '_liveApply "$@"' _ "$cfg" "$t" "$mode" "$key" >>"artifacts/deploy_${cfg}.log" 2>&1
                      rc=$?
                      # rc=2: protocol drift (target gate predates the free-space
                      # query) — a transition condition, not a target failure:
                      # warn + skip; the job stays green if drift is the only anomaly.
                      if [ "$rc" -eq 2 ]; then echo "::warning::$cfg: skipped — target $host rejected the free-space query (protocol drift); transition: deployUser.sshGate=\"restrict\" (see artifacts/deploy_${cfg}.log)"; continue; fi
                      if [ "$rc" -eq 124 ]; then echo "::error::$cfg: exceeded per-target timeout (${tmo}m)"; failed_targets="$failed_targets $cfg"; continue; fi
                      if [ "$rc" -ne 0 ]; then echo "::error::$cfg: live deploy failed"; tail -n 50 "artifacts/deploy_${cfg}.log"; failed_targets="$failed_targets $cfg"; continue; fi ;;
            ab-image) timeout "${tmo}m" bash -c '_abImage "$@"' _ "$cfg" "$t" "$mode" "$key" >>"artifacts/deploy_${cfg}.log" 2>&1
                      rc=$?
                      if [ "$rc" -eq 124 ]; then echo "::error::$cfg: exceeded per-target timeout (${tmo}m)"; failed_targets="$failed_targets $cfg"; continue; fi
                      if [ "$rc" -ne 0 ]; then echo "::error::$cfg: ab-image deploy failed"; tail -n 50 "artifacts/deploy_${cfg}.log"; failed_targets="$failed_targets $cfg"; continue; fi ;;
            *) echo "::error::$cfg: unknown method '$method'"; exit 1 ;;
          esac
        done

        if [ -n "$failed_targets" ]; then
          echo "::error::deploy-target: failed targets:${failed_targets}"
          exit 1
        fi

        echo ""
        echo "deploy-target: done (mode=$mode)."

    - name: Upload deploy logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: deploy-logs
        path: artifacts/
