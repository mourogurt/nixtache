name: "SSH Setup"
description: "Configure the bot SSH key (from systemd LoadCredential) for git push and SSH commit signing"

inputs:
  git-host:
    description: "Git host to configure in the SSH config, optionally host:port (e.g. code.zinzaguras.ru or localhost:7111)"
    required: false
    default: "code.zinzaguras.ru"
  git-user:
    description: "Fallback SSH user (server RUN_USER) if the runner module did not export one for this purpose."
    required: false
    default: "git"
  creds:
    description: "Which credential bundle to use: `flake` (fetch private flake inputs) or `update` (update-flake push+sign). Selects the LoadCredential (flake_ssh_* / update_ssh_*) and the NIXTACHE_<CREDS>_GIT_USER env."
    required: false
    default: "flake"
  required:
    description: "If \"true\", fail when the chosen SSH key is not provided by the runner. Default \"false\" = skip with a warning (the corresponding *SshCreds is not set)."
    required: false
    default: "false"

outputs:
  key-path:
    description: "Path to the configured SSH private key (use for `git config user.signingkey`); empty when no key was provided."
    value: ${{ steps.setup.outputs.key-path }}
  config-path:
    description: "Path to the generated SSH config file (use for `ssh -F ...`); empty when no key was provided."
    value: ${{ steps.setup.outputs.config-path }}

runs:
  using: "composite"
  steps:
    - name: Configure SSH
      id: setup
      shell: bash
      run: |
        set -euo pipefail
        ssh_dir="${{ runner.temp }}/ssh"
        cfg="$ssh_dir/config"
        mkdir -p "$ssh_dir"

        # Keys are provided by the runner host via systemd LoadCredential, one
        # pair per purpose: `<creds>_ssh_private` / `<creds>_ssh_public` where
        # <creds> ∈ {flake, update} (see nixtache runner module flakeSshCreds /
        # updateSshCreds). Each pair is present only when the consumer set the
        # matching option, so missing creds => graceful skip (or error if
        # `required: true`).
        creds="${{ inputs.creds }}"
        cred_dir="${CREDENTIALS_DIRECTORY:-}"
        if [ -z "$cred_dir" ] || [ ! -f "$cred_dir/${creds}_ssh_private" ] || [ ! -f "$cred_dir/${creds}_ssh_public" ]; then
          msg="ssh-setup: '${creds}' SSH credentials not provided by the runner (LoadCredential ${creds}_ssh_private/${creds}_ssh_public absent — services.nixtache.runner.${creds}SshCreds is null)."
          if [ "${{ inputs.required }}" = "true" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping SSH setup."
          echo "key-path=" >> "$GITHUB_OUTPUT"
          echo "config-path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Git SSH user for this purpose: the runner module exports
        # NIXTACHE_<CREDS>_GIT_USER (server RUN_USER, e.g. forgejo/git); fall
        # back to the `git-user` input.
        case "$creds" in
          flake) git_user="${NIXTACHE_FLAKE_GIT_USER:-${{ inputs.git-user }}}" ;;
          update) git_user="${NIXTACHE_UPDATE_GIT_USER:-${{ inputs.git-user }}}" ;;
          *) git_user="${{ inputs.git-user }}" ;;
        esac

        cp "$cred_dir/${creds}_ssh_private" "$ssh_dir/id_key"
        cp "$cred_dir/${creds}_ssh_public" "$ssh_dir/id_key.pub"
        chmod 400 "$ssh_dir/id_key"
        chmod 400 "$ssh_dir/id_key.pub"

        # git-host may carry a port (host:port, e.g. a Forgejo test instance
        # at localhost:7111); split it into HostName + Port so the `Host`
        # pattern still matches the bare hostname git passes to ssh.
        git_host="${{ inputs.git-host }}"
        git_port=""
        case "$git_host" in
          *:*) git_port="${git_host##*:}"; git_host="${git_host%:*}" ;;
        esac

        echo "Host $git_host" > "$cfg"
        echo "  HostName $git_host" >> "$cfg"
        [ -n "$git_port" ] && echo "  Port $git_port" >> "$cfg"
        echo "  User $git_user" >> "$cfg"
        echo "  IdentityFile $ssh_dir/id_key" >> "$cfg"

        git config --global core.sshCommand "ssh -F $cfg"

        echo "key-path=$ssh_dir/id_key" >> "$GITHUB_OUTPUT"
        echo "config-path=$cfg" >> "$GITHUB_OUTPUT"
