name: "SSH Setup"
description: "Configure the bot SSH key (from systemd LoadCredential) for git push and SSH commit signing"

inputs:
  git-host:
    description: "Git host to configure in the SSH config (e.g. code.zinzaguras.ru)"
    required: false
    default: "code.zinzaguras.ru"
  git-user:
    description: "SSH user for the git host (the bot account)"
    required: false
    default: "fbot"
  required:
    description: "If \"true\", fail when the bot SSH key is not provided by the runner. Default \"false\" = skip with a warning (the runner instance has no secrets.ssh* set)."
    required: false
    default: "false"

outputs:
  key-path:
    description: "Path to the configured SSH private key (use for `git config user.signingkey`); empty when no key was provided."
    value: ${{ steps.setup.outputs.key-path }}
  config-path:
    description: "Path to the generated SSH config file (use for `ssh -F ...`); empty when no key was provided."
    value: ${{ steps.setup.outputs.config-path }}

runs:
  using: "composite"
  steps:
    - name: Configure SSH
      id: setup
      shell: bash
      run: |
        set -euo pipefail
        ssh_dir="${{ runner.temp }}/ssh"
        cfg="$ssh_dir/config"
        mkdir -p "$ssh_dir"

        # Keys are provided by the runner host via systemd LoadCredential
        # (see nixtache forgejo-runner module: gitea-runner-<name> LoadCredential,
        # only present when the instance's secrets.ssh* are set). Check presence
        # so build-only / test instances (no bot key) don't fail here.
        cred_dir="${CREDENTIALS_DIRECTORY:-}"
        if [ -z "$cred_dir" ] || [ ! -f "$cred_dir/ssh_private" ] || [ ! -f "$cred_dir/ssh_public" ]; then
          msg="ssh-setup: bot SSH key not provided by the runner (LoadCredential ssh_private/ssh_public absent — the nixtache instance has no secrets.ssh* set)."
          if [ "${{ inputs.required }}" = "true" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping SSH setup."
          echo "key-path=" >> "$GITHUB_OUTPUT"
          echo "config-path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        cp "$cred_dir/ssh_private" "$ssh_dir/id_key"
        cp "$cred_dir/ssh_public" "$ssh_dir/id_key.pub"
        chmod 400 "$ssh_dir/id_key"
        chmod 400 "$ssh_dir/id_key.pub"

        echo "Host ${{ inputs.git-host }}" > "$cfg"
        echo "  HostName ${{ inputs.git-host }}" >> "$cfg"
        echo "  User ${{ inputs.git-user }}" >> "$cfg"
        echo "  IdentityFile $ssh_dir/id_key" >> "$cfg"

        git config --global core.sshCommand "ssh -F $cfg"

        echo "key-path=$ssh_dir/id_key" >> "$GITHUB_OUTPUT"
        echo "config-path=$cfg" >> "$GITHUB_OUTPUT"
