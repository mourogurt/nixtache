name: "SSH Setup"
description: "Configure the bot SSH key (from systemd LoadCredential) for git push and SSH commit signing"

inputs:
  git-host:
    description: "Space-separated git host list to configure in the SSH config — one Host block per host, each entry optionally host:port (e.g. 'git.example.org git.example.org:2222 localhost:7111')"
    required: true
  git-user:
    description: "Fallback SSH user (server RUN_USER) if the runner module did not export one for this purpose."
    required: false
    default: "git"
  creds:
    description: "Credential bundle(s) to use, space-separated: `flake` (fetch private flake inputs) and/or `update` (update-flake push+sign). Each selects the LoadCredential pair (<creds>_ssh_*) and the NIXTACHE_<CREDS>_GIT_USER env; one Host block gets one IdentityFile per available bundle."
    required: false
    default: "flake"
  required:
    description: "If \"true\", fail when the chosen SSH key is not provided by the runner. Default \"false\" = skip with a warning (the corresponding *SshCreds is not set)."
    required: false
    default: "false"

outputs:
  key-path:
    description: "Path to the configured SSH private key (use for `git config user.signingkey`); empty when no key was provided."
    value: ${{ steps.setup.outputs.key-path }}
  config-path:
    description: "Path to the generated SSH config file (use for `ssh -F ...`); empty when no key was provided."
    value: ${{ steps.setup.outputs.config-path }}

runs:
  using: "composite"
  steps:
    - name: Configure SSH
      id: setup
      shell: bash
      run: |
        set -euo pipefail
        ssh_dir="${{ runner.temp }}/ssh"
        cfg="$ssh_dir/config"
        mkdir -p "$ssh_dir"

        # Keys are provided by the runner host via systemd LoadCredential, one
        # pair per purpose: `<creds>_ssh_private` / `<creds>_ssh_public` where
        # <creds> in {flake, update} (see nixtache runner module flakeSshCreds /
        # updateSshCreds). `creds` accepts a space-separated list so one job
        # can both fetch private inputs (flake) and push/sign (update) through
        # a single core.sshCommand: the Host block below gets one IdentityFile
        # line per available bundle and ssh offers them in order. A bundle
        # whose key pair is absent is skipped with a warning (or fails the
        # step when `required: true`).
        cred_dir="${CREDENTIALS_DIRECTORY:-}"
        requested="${{ inputs.creds }}"
        available=""
        for creds in $requested; do
          if [ -n "$cred_dir" ] && [ -f "$cred_dir/${creds}_ssh_private" ] && [ -f "$cred_dir/${creds}_ssh_public" ]; then
            # Single-bundle invocations keep the historical id_key filename so
            # existing callers' generated configs stay byte-identical.
            dest="id_key"
            if [ "$requested" != "$creds" ]; then dest="id_key_$creds"; fi
            cp "$cred_dir/${creds}_ssh_private" "$ssh_dir/$dest"
            cp "$cred_dir/${creds}_ssh_public" "$ssh_dir/$dest.pub"
            chmod 400 "$ssh_dir/$dest" "$ssh_dir/$dest.pub"
            available="$available $creds"
          else
            msg="ssh-setup: '${creds}' SSH credentials not provided by the runner (LoadCredential ${creds}_ssh_private/${creds}_ssh_public absent — services.nixtache.runner.${creds}SshCreds is null)."
            if [ "${{ inputs.required }}" = "true" ]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::warning::$msg Skipping the '${creds}' bundle."
          fi
        done
        available="${available# }"

        if [ -z "$available" ]; then
          echo "::warning::ssh-setup: none of the requested bundles ($requested) provided by the runner; git/ssh fall back to the default environment."
          echo "key-path=" >> "$GITHUB_OUTPUT"
          echo "config-path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Git SSH user: the runner module exports NIXTACHE_<CREDS>_GIT_USER
        # (server RUN_USER, e.g. forgejo/git); fall back to the `git-user`
        # input. With several bundles the update user wins — push/sign is the
        # privileged operation the config exists for.
        case " $available " in
          *" update "*) git_user="${NIXTACHE_UPDATE_GIT_USER:-${{ inputs.git-user }}}" ;;
          *" flake "*)  git_user="${NIXTACHE_FLAKE_GIT_USER:-${{ inputs.git-user }}}" ;;
          *)            git_user="${{ inputs.git-user }}" ;;
        esac

        # git-host is a space-separated host list: one git server is often
        # reached under several hostnames (push host alias + flake.lock input
        # hosts), and ssh offers the keys below only for hosts with a Host
        # block, so every listed host gets its own block. Each entry may
        # carry a port (host:port, e.g. a Forgejo test instance at
        # localhost:7111); the port is split into that host's own Port line
        # so the `Host` pattern still matches the bare hostname git passes
        # to ssh. Every block repeats User and all IdentityFile lines.
        : > "$cfg"
        for host_token in ${{ inputs.git-host }}; do
          git_host="$host_token"
          git_port=""
          case "$git_host" in
            *:*) git_port="${git_host##*:}"; git_host="${git_host%:*}" ;;
          esac
          echo "Host $git_host" >> "$cfg"
          echo "  HostName $git_host" >> "$cfg"
          [ -n "$git_port" ] && echo "  Port $git_port" >> "$cfg"
          echo "  User $git_user" >> "$cfg"
          for creds in $available; do
            dest="id_key"
            if [ "$requested" != "$creds" ]; then dest="id_key_$creds"; fi
            echo "  IdentityFile $ssh_dir/$dest" >> "$cfg"
          done
        done

        key_path=""
        for creds in $available; do
          dest="id_key"
          if [ "$requested" != "$creds" ]; then dest="id_key_$creds"; fi
          # key-path feeds `git config user.signingkey`: the update (signing)
          # bundle when present, else the first available bundle.
          case " $available " in
            *" update "*) if [ "$creds" = "update" ]; then key_path="$ssh_dir/$dest"; fi ;;
            *) if [ -z "$key_path" ]; then key_path="$ssh_dir/$dest"; fi ;;
          esac
        done

        git config --global core.sshCommand "ssh -F $cfg"

        echo "key-path=$key_path" >> "$GITHUB_OUTPUT"
        echo "config-path=$cfg" >> "$GITHUB_OUTPUT"
