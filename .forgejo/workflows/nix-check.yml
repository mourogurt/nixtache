# Reusable workflow: validate a nix flake and rebuild its NixOS configurations
# and devShells. Lives in nixtache and is called from consumer repositories.
#
# Per Q2=B it is invoked as:
#   jobs.check-flake.uses: nixops/nixtache/.forgejo/workflows/nix-check.yml@main
#
# The reusable workflow runs in the CALLER's context: `actions/checkout@v4`
# checks out the caller repo (so `nix flake show` sees the caller's configs).
# We additionally check out nixtache itself to resolve the composite actions
# below (robust against Forgejo's cross-repo action path resolution).
name: Nix Flake Check

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check-flake:
    runs-on: nixos
    timeout-minutes: 4600
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout nixtache (for reusable actions)
        uses: actions/checkout@v4
        with:
          repository: nixops/nixtache
          path: .nixtache
          ref: main

      - name: Derive git hosts
        # Push host = NIXTACHE_GIT_SSH_HOST (the runner module's
        # gitHost.hostNames[0] — the canonical SSH endpoint). Fallback for
        # runners not yet rebuilt with that env: the bare GITHUB_SERVER_URL
        # hostname (HTTP endpoint — its port is the HTTP port, not SSH, so
        # it must be stripped). The full host list adds every
        # ssh:///git+ssh:// host in flake.lock: nix fetches input URLs by
        # whatever hostname the consumer locked them under (possibly an
        # alias of the push host), and keys are offered only for hosts with
        # a Host block — one missing alias means Permission denied at input
        # fetch.
        id: githost
        shell: bash
        run: |
          push_host="${NIXTACHE_GIT_SSH_HOST:-}"
          if [ -z "$push_host" ]; then
            push_host="${GITHUB_SERVER_URL#https://}"; push_host="${push_host#http://}"
            push_host="${push_host%%:*}"
          fi
          hosts="$push_host"
          while IFS= read -r url; do
            case "$url" in
              git+ssh://*) url="${url#git+ssh://}" ;;
              ssh://*)     url="${url#ssh://}" ;;
              *)           continue ;;
            esac
            host="${url%%/*}"
            host="${host#*@}"
            case " $hosts " in
              *" $host "*) ;;
              *) hosts="$hosts $host" ;;
            esac
          done < <(jq -r '.nodes[].locked.url // empty' flake.lock)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        uses: ./.nixtache/.forgejo/actions/ssh-setup
        with:
          git-host: ${{ steps.githost.outputs.hosts }}
          creds: flake

      - name: Probe sandbox (runtime detect sandbox vs --no-sandbox)
        uses: ./.nixtache/.forgejo/actions/sandbox-probe

      - name: Verify flake metadata
        run: nix flake metadata

      - name: Validate Nix Configuration
        uses: ./.nixtache/.forgejo/actions/flake-validation

      - name: Rebuilding All NixOS Configurations
        uses: ./.nixtache/.forgejo/actions/rebuild-configurations
        timeout-minutes: 4320

      - name: Rebuilding All Nix DevShells
        uses: ./.nixtache/.forgejo/actions/rebuild-devshells
        timeout-minutes: 4320
        with:
          systems: "x86_64-linux"

      - name: Deploy artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: |
            artifacts/

      - name: Handle Validation Errors
        if: failure()
        run: |
          echo "Configuration validation failed! Please check the logs."
          exit 1
