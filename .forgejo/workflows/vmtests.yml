# VM test suites (vmTests.*) — KVM-only, never built by `nix flake check`
# (the nspawn CI runner cannot run QEMU). This workflow runs them on a
# KVM-capable runner (label `kvm`): manually via workflow_dispatch and on a
# weekly schedule for the full matrix; a nightly smoke subset keeps the KVM
# path warm without the heavy full-matrix rebuilds.
#
# Runner prerequisites (see doc/technical_details/testing.md):
#   - /dev/kvm exposed to the runner environment
#   - nix system-features containing `kvm` and `nixos-test` (the runner
#     module propagates the host's nix.settings.system-features into jobs)
#
# Output contract (openspec/specs/ci-workflows): each job's step output holds
# only the suite's own verdict (test-driver output when the test ran, or
# "build never reached the test" + the closing build error); the complete
# `nix build -L` transcript lands in artifacts/<suite>/full.log and is
# uploaded on every outcome. Smoke-subset membership is filtered INSIDE the
# run step (a matrix `include:` merging extra keys spawns never-starting
# duplicate jobs on this runner — observed as permanently "waiting" jobs
# holding the whole run open), so every matrix job — skipped ones included —
# produces a full.log and the upload step can require it.
name: vmtests

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "smoke | full"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - smoke
  schedule:
    # nightly smoke (03:15 UTC); the full matrix runs weekly (03:30 Sunday)
    - cron: "15 3 * * *"
    - cron: "30 3 * * 0"

env:
  # Suites the nightly/smoke subset runs. Keep this list in sync with the
  # matrix below (membership is checked by the run step, not by `include:`).
  SMOKE_SUITES: "ab-ota-e2e overlay-nix-ota-invalid-vm"

jobs:
  suites:
    # Matrix jobs are displayed under their bare suite name (spec:
    # ci-workflows — no `suites (…)` prefix).
    name: ${{ matrix.suite }}
    runs-on: kvm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Bound a full dispatch to 3 concurrent suites. The runner executes the
      # suites inside build sandboxes whose /dev/kvm access can be denied
      # (EPERM), in which case the VMs fall back to TCG emulation — several
      # CPU-hungry processes per suite. Three concurrent suites keep one
      # runner host inside its CPU/memory capacity (an unbounded dispatch of
      # ~30 suites produced QEMU/build SIGKILLs and connection resets) at the
      # cost of a longer dispatch.
      max-parallel: 3
      matrix:
        # smoke keeps the KVM path warm nightly: one OTA e2e variant + the
        # replication baseline. Full = the whole vmTests inventory; the
        # heaviest suites (rollback, the ota-invalid variants) get generous
        # per-suite timeouts.
        suite:
          - ab-ota-e2e
          - ab-ota-e2e-erofs
          - ab-ota-e2e-none
          - ab-ota-anywhere-vm
          - ab-deploy
          - ab-vm
          - ab-provision-vm
          - ab-runner-compat-vm
          - ab-compression-vm
          - ab-staging-vm
          - ab-deploy-self-vm
          - ab-ota-verify-vm
          - ab-ota-rollback-vm
          - ab-ota-noop-vm
          - ab-ota-interrupted-vm
          - ab-ota-migrate-vm
          - ab-ota-migrate-boot-vm
          - ab-ota-migrate-boot-override-vm
          - ab-data-pool-vm
          - ab-data-pool-wipe-vm
          # runner-store-swap-{clone,overlay}-vm: the runner's relocated store
          # across a real appliance swap, with the image's lower DB and the
          # container in appliance mode. Both modes in the matrix.
          - runner-store-swap-clone-vm
          - runner-store-swap-overlay-vm
          - auto-update-vm
          - overlay-nix-vm
          - overlay-nix-install-vm
          - overlay-nix-ab-swap-vm
          - overlay-nix-ota-invalid-vm
          - overlay-nix-ota-invalid-wipe-vm
          - overlay-nix-ota-invalid-reconcile-vm
          - overlay-nix-ota-invalid-reconcile-degraded-vm
          - overlay-nix-ota-invalid-tmpfs-vm
          - runner-store-mode-vm
    steps:
      - name: Checkout nixtache
        uses: actions/checkout@v4

      - name: Probe sandbox (runtime detect sandbox vs --no-sandbox)
        # Once per matrix job, not once per workflow: sandbox health is a
        # property of the specific KVM runner the job landed on (the `kvm`
        # label may map to several machines).
        uses: ./.forgejo/actions/sandbox-probe

      - name: Run VM suite ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
          SUBSET: ${{ inputs.subset }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -uo pipefail
          log="artifacts/$SUITE/full.log"
          mkdir -p "artifacts/$SUITE"

          # Smoke-subset filtering: nightly schedule (15 3 * * *) and
          # dispatch(subset=smoke) run only SMOKE_SUITES members; everything
          # else runs the full suite. Skipped suites still write full.log so
          # the upload step (if-no-files-found: error) stays meaningful.
          if [ "$EVENT_SCHEDULE" = "15 3 * * *" ]; then subset=smoke; else subset="${SUBSET:-full}"; fi
          case " $SMOKE_SUITES " in
            *" $SUITE "*)
              if [ "$subset" = "smoke" ]; then
                echo "----- $SUITE: smoke subset member — running -----"
              fi
              ;;
            *)
              if [ "$subset" = "smoke" ]; then
                echo "smoke dispatch: $SUITE is not in the smoke set — skipped" | tee "$log"
                exit 0
              fi
              ;;
          esac

          # SANDBOX_OK is set by sandbox-probe (1 = sandbox works, 0/unset =
          # broken). Without the flag, a KVM runner whose nix sandbox is
          # broken fails the suite build on missing namespaces instead of
          # self-healing to --no-sandbox.
          if [ "${SANDBOX_OK:-0}" = "1" ]; then
            SANDBOX_FLAG=""
          else
            echo "SANDBOX_OK!=1 → --no-sandbox"
            SANDBOX_FLAG="--no-sandbox"
          fi

          # The full transcript goes to the artifact file, never to the step
          # stream; the step prints only the verdict view derived from it.
          # NOTE: the runner invokes run steps with bash -e (errexit), so
          # every command whose non-zero status is EXPECTED (a failed build,
          # a banner grep with no match) must be explicitly status-guarded.
          rc=0
          nix build -L --no-link --print-out-paths $SANDBOX_FLAG \
            ".#vmTests.x86_64-linux.$SUITE" > "$log" 2>&1 || rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "----- $SUITE: PASS (full transcript in artifact vmtests-$SUITE) -----"
            # The suite's own summary: runCommand suites (ab-vm,
            # ab-compression-vm, …) print a `=== … ===` report section —
            # show it from its last banner; runNixOSTest suites end with the
            # driver's closing lines.
            banner=$(grep -n '^=== ' "$log" | tail -1 | cut -d: -f1 || true)
            if [ -n "${banner:-}" ]; then
              tail -n +"$banner" "$log"
            else
              tail -n 20 "$log"
            fi
            exit 0
          fi

          echo "----- $SUITE: FAIL (verdict below; full transcript in artifact vmtests-$SUITE) -----"
          if grep -qE '(finished: |must succeed: |must fail: |waiting for |^=== )' "$log"; then
            # The test itself executed — show its closing output (failing
            # command, traceback, verdict lines).
            tail -n 150 "$log"
          else
            echo "build never reached the test — last 40 build-log lines:"
            tail -n 40 "$log"
          fi
          exit "$rc"

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: vmtests-${{ matrix.suite }}
          path: artifacts/${{ matrix.suite }}/
          # A suite job that ran MUST leave a full.log (skipped smoke jobs
          # write one too) — a silent no-op upload is a workflow bug and
          # fails the job.
          if-no-files-found: error
