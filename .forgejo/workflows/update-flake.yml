# Reusable workflow: update flake inputs, validate, and push a signed commit.
# Lives in nixtache and is called from consumer repositories.
#
# Per Q2=B it is invoked as:
#   jobs.update-flake.uses: nixops/nixtache/.forgejo/workflows/update-flake.yml@main
#
# NOTE: the `schedule` trigger must live in the CALLER's thin wrapper, not here
# (a schedule in nixtache would update nixtache's own flake, not the caller's).
name: Update Flakes

on:
  workflow_call:
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: nixos
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout nixtache (for reusable actions)
        uses: actions/checkout@v4
        with:
          repository: nixops/nixtache
          path: .nixtache
          ref: main

      - name: Derive git hosts
        # Push host = NIXTACHE_GIT_SSH_HOST (the runner module's
        # gitHost.hostNames[0] — the canonical SSH endpoint). Fallback for
        # runners not yet rebuilt with that env: the bare GITHUB_SERVER_URL
        # hostname. GITHUB_SERVER_URL itself is the HTTP endpoint — its port
        # is the HTTP port (e.g. localhost:7111 behind nginx), NOT an SSH
        # port, so it must be stripped; ssh (default 22, or a Port from the
        # ssh-setup config) handles transport. The full host list adds every
        # ssh:///git+ssh:// host in flake.lock: nix contacts input URLs by
        # whatever hostname the consumer locked them under (possibly an
        # alias of the push host), and keys are offered only for hosts with
        # a Host block — one missing alias means Permission denied at
        # `nix flake update`. Runs unconditionally: ssh-setup, the guard
        # probe and the push all need these outputs.
        id: githost
        shell: bash
        run: |
          push_host="${NIXTACHE_GIT_SSH_HOST:-}"
          if [ -z "$push_host" ]; then
            push_host="${GITHUB_SERVER_URL#https://}"; push_host="${push_host#http://}"
            push_host="${push_host%%:*}"
          fi
          hosts="$push_host"
          while IFS= read -r url; do
            case "$url" in
              git+ssh://*) url="${url#git+ssh://}" ;;
              ssh://*)     url="${url#ssh://}" ;;
              *)           continue ;;
            esac
            host="${url%%/*}"
            host="${host#*@}"
            case " $hosts " in
              *" $host "*) ;;
              *) hosts="$hosts $host" ;;
            esac
          done < <(jq -r '.nodes[].locked.url // empty' flake.lock)
          echo "push-host=$push_host" >> "$GITHUB_OUTPUT"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        # Unconditional: the action warns and skips bundles the runner does
        # not provide, and the guard below needs the SSH config in place to
        # probe the update credential. Both bundles: `flake` fetches private
        # inputs during nix flake update, `update` pushes and signs.
        id: ssh
        uses: ./.nixtache/.forgejo/actions/ssh-setup
        with:
          git-host: ${{ steps.githost.outputs.hosts }}
          creds: flake update

      - name: Guard — update-flake enabled?
        # update-flake needs push credentials. The nixtache runner module
        # exports NIXTACHE_UPDATE_GIT_USER only when `updateSshCreds` is set;
        # if it's absent, no-op the whole job with a warning. When it IS set,
        # validate the key immediately — authenticate and read the caller repo
        # over the push URL — so a broken key fails here instead of at the
        # final push, after a full update+validate+rebuild run. ls-remote
        # proves auth and repo read access; write permission cannot be probed
        # without pushing.
        id: guard
        shell: bash
        run: |
          # The "Deploy artifacts" upload below is `if: always()` — the
          # directory must exist even when every work step is skipped or the
          # first step fails, so create it here unconditionally.
          mkdir -p artifacts
          if [ -z "${NIXTACHE_UPDATE_GIT_USER:-}" ]; then
            echo "::warning::update-flake disabled: services.nixtache.runner.updateSshCreds is null (no push credential). Set updateSshCreds to enable."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="ssh://${NIXTACHE_UPDATE_GIT_USER}@${{ steps.githost.outputs.push-host }}/${GITHUB_REPOSITORY}"
          if ! timeout 30 git ls-remote "$url" HEAD > /dev/null 2>&1; then
            echo "::error::update-flake: updateSshCreds is set but the update key cannot read $url (auth or repo access failed). Fix the deploy key on the git server, or set updateSshCreds = null to disable update-flake."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Git
        # Bot identity (commit author) from the runner module (NIXTACHE_BOT_*),
        # signing key = the update SSH key loaded above.
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config --local user.name "${NIXTACHE_BOT_NAME:-fbot}"
          git config --local user.email "${NIXTACHE_BOT_EMAIL:-fbot@localhost}"
          git config --local user.signingkey "${{ steps.ssh.outputs.key-path }}"
          git config --local gpg.format ssh

      - name: Probe sandbox (runtime detect sandbox vs --no-sandbox)
        if: steps.guard.outputs.enabled == 'true'
        uses: ./.nixtache/.forgejo/actions/sandbox-probe

      - name: Update Flakes Inputs
        if: steps.guard.outputs.enabled == 'true'
        run: |
          # pipefail: a failed nix flake update must still fail the step even
          # though tee swallows the pipeline's stdout; artifacts/ is created
          # by the guard step above.
          set -o pipefail
          nix flake update --commit-lock-file 2>&1 | tee artifacts/flake-update.log
          # nix downgrades input fetch failures to warnings ("using expired
          # cached ref", "continuing with the most recent version") and still
          # exits 0 — an unreachable private input would otherwise produce a
          # green run pushing a stale lock file. Fail on the error lines in
          # the captured log.
          if grep -E '^error: Failed to fetch|Permission denied|Could not read from remote' artifacts/flake-update.log; then
            echo "::error::nix flake update could not fetch all inputs (see artifacts/flake-update.log); refusing to push a stale lock file."
            exit 1
          fi

      - name: Validate Nix Configuration
        if: steps.guard.outputs.enabled == 'true'
        uses: ./.nixtache/.forgejo/actions/flake-validation

      - name: Rebuilding All NixOS Configurations
        if: steps.guard.outputs.enabled == 'true'
        uses: ./.nixtache/.forgejo/actions/rebuild-configurations

      - name: Rebuilding All Nix DevShells
        if: steps.guard.outputs.enabled == 'true'
        uses: ./.nixtache/.forgejo/actions/rebuild-devshells
        timeout-minutes: 4320
        with:
          systems: "x86_64-linux"

      - name: Push Changes
        # SSH push URL from server state — no hardcoded user/host.
        # NIXTACHE_UPDATE_GIT_USER = server RUN_USER (from updateSshCreds.user);
        # push host = the FIRST derived host, i.e. NIXTACHE_GIT_SSH_HOST (see
        # the githost step); repo/ref from GitHub-compat env.
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          url="ssh://${NIXTACHE_UPDATE_GIT_USER}@${{ steps.githost.outputs.push-host }}/${GITHUB_REPOSITORY}"
          echo "Setting origin to $url"
          git remote set-url origin "$url"
          echo "Pushing to ${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"

      - name: Deploy artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: |
            artifacts/

      - name: Handle Validation Errors
        if: failure()
        run: |
          echo "Configuration validation failed! Please check the build logs artifact."
          exit 1
