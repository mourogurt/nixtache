# Nixtache self-update: bump THIS flake's own flake.lock through the shared
# update pipeline. The schedule and manual entry point live here because
# update-flake.yml is a reusable workflow that updates its CALLER's flake —
# nixtache is the caller for itself, and its maintenance policy (schedule,
# runner) belongs in its own thin wrapper, not in the consumer-facing
# reusable workflow.
#
# The nixtache-self validation profile skips the consumer-only NixOS
# configuration and devShell rebuilds: nixtache exposes no consumer
# nixosConfigurations (only the abtest-remote dogfood fixture) and no
# devShells, and flake-validation already builds every checks.* suite.
#
# A preflight on the dedicated `test` runner selects an online `kvm` runner
# through the Forgejo API, or retains `test` when no optional KVM runner is
# available. A capability probe on that candidate falls back to `test` when
# /dev/kvm is unusable; the reusable pipeline skips VM suites in that case.
# In the Forgejo UI the call renders as two jobs: `update-flake` (0s caller)
# and `update-flake-1` (the work). Expected.
name: Self Update Flake

enable-openid-connect: true

on:
  # Monday 04:15 UTC.
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

jobs:
  select-runner:
    runs-on: test
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Select an online KVM runner or fall back to test
        id: select
        shell: bash
        env:
          RUNNER_DISCOVERY_AUDIENCE: ${{ vars.NIXTACHE_RUNNER_DISCOVERY_AUDIENCE }}
        run: |
          set -uo pipefail
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          api="${GITHUB_API_URL:-${GITHUB_SERVER_URL%/}/api/v1}"
          runner=test
          if [ -z "${RUNNER_DISCOVERY_AUDIENCE:-}" ]; then
            echo "::warning::self-update: NIXTACHE_RUNNER_DISCOVERY_AUDIENCE is not configured; selecting the test runner."
          elif [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::warning::self-update: OpenID Connect is unavailable; selecting the test runner."
          elif ! jwt=$(curl -fsS --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNNER_DISCOVERY_AUDIENCE" \
            | jq -r '.value // empty'); then
            echo "::warning::self-update: could not obtain a runner-discovery JWT; selecting the test runner."
          elif [ -z "$jwt" ]; then
            echo "::warning::self-update: runner-discovery JWT response was empty; selecting the test runner."
          elif ! curl -fsS --max-time 30 \
            -H "Authorization: Bearer $jwt" \
            "$api/repos/$GITHUB_REPOSITORY/actions/runners" -o "$response"; then
            echo "::warning::self-update: Forgejo runner discovery failed; selecting the test runner."
          elif jq -e '
            def online_kvm:
              ((.status // "") == "active" or (.status // "") == "idle") and
              any(.labels[]?;
                (if type == "string" then . else (.name // "") end)
                | split(":")[0] == "kvm");
            (if type == "array" then . else (.runners // []) end)
            | any(.[]?; online_kvm)
          ' "$response" > /dev/null; then
            runner=kvm
          else
            echo "::warning::self-update: no online kvm runner found; selecting the test runner."
            jq -c '
              def runner_list: if type == "array" then . else (.runners // []) end;
              "self-update: runners API summary: " + ({
                top_level_keys: (if type == "object" then keys else [] end),
                runners: (runner_list | map({name, status, labels}))
              } | tojson)
            ' "$response"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "self-update: selected the $runner runner."

  probe-runner:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    outputs:
      runner: ${{ steps.probe.outputs.runner }}
    steps:
      - name: Check KVM on the selected runner
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          candidate="${{ needs.select-runner.outputs.runner }}"
          runner=test
          if [ "$candidate" = "kvm" ]; then
            if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              runner=kvm
            else
              if [ -e /dev/kvm ]; then
                ls -l /dev/kvm
              else
                echo "self-update: /dev/kvm does not exist in the runner job environment."
              fi
              id
              echo "::warning::self-update: the online kvm runner has no usable /dev/kvm; selecting the test runner."
            fi
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "self-update: selected the $runner runner after the KVM capability probe."

  update-flake:
    needs: probe-runner
    uses: nixops/nixtache/.forgejo/workflows/update-flake.yml@main
    with:
      runner: ${{ needs.probe-runner.outputs.runner }}
      validation-profile: nixtache-self
    secrets: inherit
