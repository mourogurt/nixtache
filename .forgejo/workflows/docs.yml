# Reusable workflow: build a flake's documentation outputs and upload them as
# a CI artifact. Lives in nixtache and is called from consumer repositories.
#
# Per Q2=B it is invoked as:
#   jobs.docs.uses: nixops/nixtache/.forgejo/workflows/docs.yml@main
#
# The reusable workflow runs in the CALLER's context: `actions/checkout@v4`
# checks out the caller repo (so `nix build .#<attr>` sees the caller's flake).
# We additionally check out nixtache itself to resolve the composite action
# (robust against Forgejo's cross-repo action path resolution).
#
# Default `attributes` is `docs` — the combined artifact produced by
# `nixtache.lib.mkDocs`. Override `inputs.attributes` to build per-machine
# references (`configurationDocs-server`) or a different attribute name.
#
# Private flake inputs: before the docs build, the SSH host list is derived
# from the push host plus every `ssh://`/`git+ssh://` host in the caller's
# `flake.lock`, and `ssh-setup` wires the `flake` credential bundle. The
# bundle is optional: runners without `flakeSshCreds` warn and skip it, so
# public-only callers keep building. Every derived host needs a matching
# known-hosts entry (`gitHost`/`extraKnownHosts`).
#
# In the Forgejo UI a reusable call renders as two jobs: `docs` (0s caller) and
# `docs-1` (the work). Expected.
name: Generate documentation

on:
  workflow_call:
    inputs:
      attributes:
        description: "Newline- or space-separated flake attributes to build (default `docs`)."
        type: string
        default: "docs"
      artifact-name:
        description: "Uploaded artifact name (default `docs`)."
        type: string
        default: "docs"
  workflow_dispatch:
    inputs:
      attributes:
        description: "Flake attributes to build."
        type: string
        default: "docs"

jobs:
  docs:
    runs-on: nixos
    timeout-minutes: 120
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout nixtache (for the reusable action)
        uses: actions/checkout@v4
        with:
          repository: nixops/nixtache
          path: .nixtache
          ref: main

      - name: Derive git hosts
        # Same derivation as nix-check.yml: push host =
        # NIXTACHE_GIT_SSH_HOST (fallback: bare GITHUB_SERVER_URL hostname,
        # HTTP port stripped), plus every ssh:///git+ssh:// host in the
        # caller's flake.lock — nix fetches inputs by the locked hostname
        # (possibly an alias of the push host) and ssh offers the credential
        # key only for hosts with a Host block, so one missing alias means
        # Permission denied at input fetch.
        id: githost
        shell: bash
        run: |
          push_host="${NIXTACHE_GIT_SSH_HOST:-}"
          if [ -z "$push_host" ]; then
            push_host="${GITHUB_SERVER_URL#https://}"; push_host="${push_host#http://}"
            push_host="${push_host%%:*}"
          fi
          hosts="$push_host"
          while IFS= read -r url; do
            case "$url" in
              git+ssh://*) url="${url#git+ssh://}" ;;
              ssh://*)     url="${url#ssh://}" ;;
              *)           continue ;;
            esac
            host="${url%%/*}"
            host="${host#*@}"
            case " $hosts " in
              *" $host "*) ;;
              *) hosts="$hosts $host" ;;
            esac
          done < <(jq -r '.nodes[].locked.url // empty' flake.lock)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        # flake bundle only, required left at its default (false): runners
        # without flakeSshCreds warn and skip the bundle, so public-only
        # callers keep building; private-input callers need
        # services.nixtache.runner.flakeSshCreds on the runner host.
        uses: ./.nixtache/.forgejo/actions/ssh-setup
        with:
          git-host: ${{ steps.githost.outputs.hosts }}
          creds: flake

      - name: Probe sandbox (runtime detect sandbox vs --no-sandbox)
        # generate-docs reads SANDBOX_OK; without the probe it always falls
        # back to --no-sandbox, losing build isolation on healthy runners.
        uses: ./.nixtache/.forgejo/actions/sandbox-probe

      - name: Generate documentation
        uses: ./.nixtache/.forgejo/actions/generate-docs
        with:
          attributes: ${{ inputs.attributes }}
          artifact-name: ${{ inputs.artifact-name }}

      - name: Report failure
        if: failure()
        run: |
          echo "Documentation generation failed! See the logs above."
          exit 1
