name: probe-matrix

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "smoke | full"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - smoke

env:
  SMOKE_SUITES: "alpha gamma"

jobs:
  suites:
    name: ${{ matrix.suite }}
    runs-on: test
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite:
          - alpha
          - beta
          - gamma
          - delta
    steps:
      - name: emit
        env:
          SUITE: ${{ matrix.suite }}
          SUBSET: ${{ inputs.subset }}
        run: |
          echo "suite=$SUITE subset=${SUBSET:-full}"
          case " $SMOKE_SUITES " in
            *" $SUITE "*) echo "smoke member" ;;
            *) if [ "${SUBSET:-full}" = "smoke" ]; then echo "skipped"; exit 0; fi ;;
          esac
          sleep 5
