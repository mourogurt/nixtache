name: probe-kvm

on:
  workflow_dispatch:

jobs:
  ping:
    name: kvm-runner-health
    runs-on: kvm
    timeout-minutes: 5
    steps:
      - name: check kvm
        run: |
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          grep -c processor /proc/cpuinfo
          cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true
          ls -la /dev/kvm /dev/net/tun 2>&1 || true
          df -h /nix 2>/dev/null | tail -1 || true
