# Self-CI for nixtache: validate the flake and run its `checks.*` (the
# pure-eval module test suites in tests/).
#
# Unlike nix-check.yml / update-flake.yml (reusable workflows meant for
# CONSUMER repositories), this triggers on push/PR to nixtache's own main
# branch. nixtache exposes no consumer-facing `nixosConfigurations` (only the
# `abtest-remote` dogfood fixture) and no devShells, so we run flake
# validation + the checks and skip the rebuild actions
# (rebuild-configurations hard-fails when a flake has no nixosConfigurations).
#
# `nix flake check` already builds `checks.*`, i.e. it runs the tests; the
# explicit `nix build --print-build-logs` loop below is there to surface each
# suite's test report (ok/FAIL lines) directly in the CI log.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # Runs on the dedicated `test` runner instance (label `test:host`),
    # registered (in Forgejo) for nixops/nixtache — see nixos-configuration
    # services.nixtache.runner.instances.test + the test-runner-env secret.
    runs-on: test
    timeout-minutes: 120
    steps:
      - name: Checkout nixtache
        uses: actions/checkout@v4

      - name: Probe sandbox (runtime detect sandbox vs --no-sandbox)
        uses: ./.forgejo/actions/sandbox-probe

      - name: Verify flake metadata
        run: nix flake metadata

      - name: Validate flake (evaluates modules + builds checks)
        uses: ./.forgejo/actions/flake-validation

      - name: Run module tests
        run: |
          set -euo pipefail
          # SANDBOX_OK is set by sandbox-probe (1 = sandbox works, 0/unset = broken).
          if [ "${SANDBOX_OK:-0}" = "1" ]; then
            SANDBOX_FLAG=""
          else
            echo "SANDBOX_OK!=1 → --no-sandbox"
            SANDBOX_FLAG="--no-sandbox"
          fi
          for suite in runner deploy-target ab-image mkDocs ab-existing ab-contract auto-update ab-deploy-drift ci-workflow-drift; do
            echo "----- checks.x86_64-linux.${suite}: test report -----"
            out=$(nix build --no-link --print-out-paths --print-build-logs $SANDBOX_FLAG ".#checks.x86_64-linux.${suite}")
            cat "$out"
          done

      - name: Generate this flake's option docs
        # Build `.#optionsMarkdown` + `.#optionsJSON` (this flake's own option
        # reference, generated from all nixtache modules) and upload as an artifact.
        uses: ./.forgejo/actions/generate-docs
        with:
          attributes: "optionsMarkdown optionsJSON"
          artifact-name: nixtache-options

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: artifacts/

      - name: Report failure
        if: failure()
        run: |
          echo "nixtache CI failed! See the logs above or the logs artifact."
          exit 1
