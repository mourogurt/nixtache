# Self-CI for nixtache: validate the flake and run its `checks.*` (the
# runner module tests in tests/runner.nix).
#
# Unlike nix-check.yml / update-flake.yml (reusable workflows meant for
# CONSUMER repositories), this triggers on push/PR to nixtache's own main
# branch. nixtache exports only `nixosModules` + `checks` (no
# nixosConfigurations, no devShells), so we run flake validation + the checks
# and skip the rebuild actions (rebuild-configurations hard-fails when a flake
# has no nixosConfigurations).
#
# `nix flake check` already builds `checks.*`, i.e. it runs the tests; the
# explicit `nix build --print-build-logs` step below is there to surface the
# test report (per-check ok/FAIL lines) directly in the CI log.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # Runs on the dedicated `test` runner instance (label `test:host`),
    # registered (in Forgejo) for nixops/nixtache — see nixos-configuration
    # services.nixtache.runner.instances.test + the test-runner-env secret.
    runs-on: test
    timeout-minutes: 120
    steps:
      - name: Checkout nixtache
        uses: actions/checkout@v4

      - name: Verify flake metadata
        run: nix flake metadata

      - name: Validate flake (evaluates modules + builds checks)
        uses: ./.forgejo/actions/flake-validation

      - name: Run module tests
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths --print-build-logs .#checks.x86_64-linux.runner)
          echo "----- module test report -----"
          cat "$out"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: artifacts/

      - name: Report failure
        if: failure()
        run: |
          echo "nixtache CI failed! See the logs above or the logs artifact."
          exit 1
